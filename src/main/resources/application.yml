
spring:
  application:
    name: SHER

  datasource:
    url: ${DB_URL:jdbc:h2:mem:sherdb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.sher.security: INFO
